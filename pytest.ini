[pytest]
# Pytest configuration for PSN

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Coverage options (when using --cov)
[coverage:run]
source = .
omit =
    */tests/*
    */anaconda3/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
